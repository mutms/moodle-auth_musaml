name: SAML authentication
summary: A SAML 2.0 service provider for Moodle, based on the php-saml library
description: |
  Users log in to Moodle through a SAML 2.0 identity provider, such as Google
  Workspace, Keycloak or Okta.

  Each identity provider is configured on its own page, with its own attribute
  mappings, and a tenant identity provider appears on that tenant login page only.
  Every user is mapped to a permanent account id from the identity provider, so
  renaming a user or changing their email cannot break the mapping. Mappings are
  made by hand, from a CSV file, or at first login.

  Logins must start at this site, unsolicited responses are refused.
